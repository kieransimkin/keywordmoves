name: Build and publish tagged releases
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing validated GitHub release tag vMAJOR.MINOR.PATCH
        required: true
permissions:
  contents: read
concurrency:
  group: pypi-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install -e ".[dev]" twine
      - run: python -m pytest
      - run: ruff check src tests
      - name: Build exact tested source
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python -c "import os,pathlib,tomllib; p=tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']; assert p['name']=='keywordmoves' and 'v'+p['version']==os.environ['TAG_NAME']"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$TAG_NAME^{commit}")"
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          python -m build
          python -m twine check --strict dist/*.whl dist/*.tar.gz
          (cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v7
        with:
          name: keywordmoves-dist
          path: dist/*
          if-no-files-found: error
  github-release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: keywordmoves-dist
          path: dist
      - name: Publish and independently verify the tested release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          (cd dist && sha256sum --check SHA256SUMS.txt)
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Existing release is immutable; use the registry retry route.' >&2
            exit 1
          fi
          gh release create "$TAG_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "KeywordMoves $TAG_NAME" --notes "Validated source: $GITHUB_SHA. Tests, lint and package metadata passed. Website: https://kieransimkin.co.uk/danceflow/"
          gh release download "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --dir downloaded
          (cd downloaded && sha256sum --check SHA256SUMS.txt)
  pypi:
    needs: github-release
    if: always() && (needs.github-release.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    env:
      TAG_NAME: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate requested immutable tag
        run: '[[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG_NAME }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Download already tested GitHub release assets
        run: gh release download "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --dir release-dist --pattern '*.whl' --pattern '*.tar.gz' --pattern SHA256SUMS.txt
      - name: Verify source, package versions and exact published bytes
        run: |
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$TAG_NAME^{commit}")"
          (cd release-dist && sha256sum --check SHA256SUMS.txt)
          python - <<'PY'
          import os, pathlib, tomllib, zipfile, tarfile, email
          project=tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']
          assert project['name']=='keywordmoves' and 'v'+project['version']==os.environ['TAG_NAME']
          root=pathlib.Path('release-dist')
          wheels=list(root.glob('*.whl')); sources=list(root.glob('*.tar.gz'))
          assert len(wheels)==len(sources)==1
          with zipfile.ZipFile(wheels[0]) as z:
              entries=[n for n in z.namelist() if n.endswith('.dist-info/METADATA')]
              assert len(entries)==1
              wheel_meta=email.message_from_bytes(z.read(entries[0]))
          with tarfile.open(sources[0],'r:gz') as t:
              source_meta=email.message_from_bytes(t.extractfile('keywordmoves-'+project['version']+'/PKG-INFO').read())
          for metadata in [wheel_meta,source_meta]:
              assert metadata['Name']==project['name'] and metadata['Version']==project['version']
          PY
          mkdir pypi-dist
          cp release-dist/*.whl release-dist/*.tar.gz pypi-dist/
          python -m pip install twine
          python -m twine check --strict pypi-dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pypi-dist/

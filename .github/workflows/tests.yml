name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev,openai,spacy,nltk,keybert]"
      - run: python -m ruff check .
      - run: python -m pytest --cov=keywordmoves --cov-report=term-missing

  spacy-model:
    runs-on: ubuntu-latest
    env:
      KEYWORDMOVES_REQUIRE_SPACY_MODEL: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,spacy]"
      - run: python -m spacy download en_core_web_sm
      - run: python -m pytest tests/test_spacy_model.py

  nltk-data:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      KEYWORDMOVES_REQUIRE_NLTK_DATA: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,nltk]"
      - run: python -m nltk.downloader -q -e punkt_tab averaged_perceptron_tagger_eng maxent_ne_chunker_tab words stopwords wordnet
      - run: python -m pytest tests/test_nltk_config.py tests/test_nltk_keywords.py tests/test_nltk_model.py

  keybert-model:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      KEYWORDMOVES_REQUIRE_KEYBERT_MODEL: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,keybert]"
      - run: python -m pytest tests/test_keybert_config.py tests/test_keybert_keywords.py tests/test_keybert_model.py

name: TikTok keyword adapters

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tiktok:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev,online]"
      - name: Lint TikTok implementation and tests
        run: >-
          python -m ruff check
          src/keywordmoves/online/tiktok.py
          src/keywordmoves/online/tiktok_analysis.py
          src/keywordmoves/online/tiktok_imports.py
          tests/test_tiktok_analysis.py
          tests/test_tiktok_api.py
          tests/test_tiktok_imports.py
          docs/examples/tiktok-workflow.py
      - name: Credential-free regression tests
        run: >-
          python -m pytest
          tests/test_tiktok_analysis.py
          tests/test_tiktok_api.py
          tests/test_tiktok_imports.py
          tests/test_online_transport.py
          tests/test_registry.py
      - name: Synthetic offline workflow
        run: python docs/examples/tiktok-workflow.py

name: google-search-tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  google-search:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev,online]"
      - name: Lint Google Search additions
        run: >-
          python -m ruff check
          src/keywordmoves/online/google_search.py
          src/keywordmoves/online/google_search_analysis.py
          src/keywordmoves/online/google_search_console.py
          src/keywordmoves/online/google_search_imports.py
          src/keywordmoves/online/google_search_providers.py
          tests/test_google_search_analysis.py
          tests/test_google_search_console.py
          tests/test_google_search_imports.py
          tests/test_google_search_providers.py
          docs/examples/google-search-workflow.py
      - name: Test without live credentials
        run: >-
          python -m pytest
          tests/test_google_search_analysis.py
          tests/test_google_search_console.py
          tests/test_google_search_imports.py
          tests/test_google_search_providers.py
      - name: Offline synthetic workflow
        run: python docs/examples/google-search-workflow.py

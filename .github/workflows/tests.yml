name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev,openai,spacy]"
      - run: python -m ruff check .
      - run: python -m pytest --cov=keywordmoves --cov-report=term-missing

  spacy-model:
    runs-on: ubuntu-latest
    env:
      KEYWORDMOVES_REQUIRE_SPACY_MODEL: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,spacy]"
      - run: python -m spacy download en_core_web_sm
      - run: python -m pytest tests/test_spacy_model.py

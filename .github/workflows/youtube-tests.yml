name: YouTube plugins
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  youtube:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev,online]"
      - name: Lint new YouTube code and tests
        run: python -m ruff check src/keywordmoves/online/youtube.py src/keywordmoves/online/youtube_analysis.py src/keywordmoves/online/youtube_imports.py src/keywordmoves/online/youtube_providers.py tests/test_youtube_analysis.py tests/test_youtube_api.py tests/test_youtube_imports.py tests/test_youtube_providers.py docs/examples/youtube-workflow.py
      - name: Credential-free contract and analysis tests
        run: python -m pytest tests/test_youtube_analysis.py tests/test_youtube_api.py tests/test_youtube_providers.py tests/test_youtube_imports.py
      - name: Offline synthetic demonstration
        run: python docs/examples/youtube-workflow.py

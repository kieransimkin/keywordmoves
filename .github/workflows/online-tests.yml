name: online-source-contracts

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  online:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev,online]"
      - run: python -m ruff check .
      - run: python -m pytest tests/test_online_api.py tests/test_online_transport.py tests/test_online_websites.py tests/test_registry.py --cov=keywordmoves.online --cov-report=term-missing

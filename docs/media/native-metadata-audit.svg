<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" role="img" aria-label="Separate bindings for new media copy audits and existing native metadata edits; both require external authorisation and native readback"><rect width="1120" height="360" rx="18" fill="#131b2a"/><g font-family="sans-serif" fill="#eef4ff"><text x="28" y="38" font-size="22">Copy checks bind to the action being reviewed</text><g font-size="17"><rect x="25" y="65" width="245" height="90" rx="12" fill="#23435d"/><text x="43" y="99">New upload / attachment</text><text x="43" y="129">Actual media SHA-256</text><rect x="330" y="65" width="270" height="90" rx="12" fill="#285a59"/><text x="350" y="99">plan → audit</text><text x="350" y="129">Exact media + caption</text><rect x="25" y="185" width="245" height="105" rx="12" fill="#564772"/><text x="43" y="219">Existing native post text</text><text x="43" y="249">Account + object ID</text><text x="43" y="276">Before-metadata hash</text><rect x="330" y="185" width="270" height="105" rx="12" fill="#75474e"/><text x="350" y="219">plan-native → audit-native</text><text x="350" y="249">Complete fields + hashes</text><text x="350" y="276">Media provenance unchecked</text><rect x="670" y="95" width="420" height="170" rx="12" fill="#283448"/><text x="690" y="129">Explicit fit, safety and fresh native context</text><text x="690" y="160">No invented media hash or authority</text><text x="690" y="191">External approval and conflict recheck</text><text x="690" y="222">Independent native save / readback</text><text x="690" y="251">A local pass does not prove persistence</text></g><text x="28" y="333" font-size="14">Generated explanatory diagram • KeywordMoves 0.6.1 • Offline checks; no uploads, native mutations or audience outcomes</text></g><g fill="#9cbce6" font-size="30"><text x="288" y="121">→</text><text x="288" y="245">→</text><text x="625" y="121">→</text><text x="625" y="245">→</text></g></svg>

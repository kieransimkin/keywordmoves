name: instagram-source-contracts

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  instagram:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev,online]"
      - run: python -m ruff check src/keywordmoves/online/instagram.py src/keywordmoves/online/instagram_analysis.py src/keywordmoves/online/instagram_imports.py tests/test_instagram_analysis.py tests/test_instagram_api.py tests/test_instagram_imports.py docs/examples/instagram-workflow.py
      - run: python -m pytest tests/test_instagram_analysis.py tests/test_instagram_api.py tests/test_instagram_imports.py tests/test_registry.py --cov=keywordmoves.online.instagram --cov=keywordmoves.online.instagram_analysis --cov=keywordmoves.online.instagram_imports --cov-report=term-missing
      - run: python docs/examples/instagram-workflow.py

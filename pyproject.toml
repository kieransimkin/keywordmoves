[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "keywordmoves"
version = "0.2.0"
description = "Modular keyword discovery and evidence analysis for the DanceFlow ecosystem"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.14"
authors = [{ name = "Kieran Simkin" }]
keywords = ["keywords", "seo", "google-trends", "nlp", "pytorch", "DanceFlow"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.optional-dependencies]
online = ["httpx>=0.27,<1", "beautifulsoup4>=4.12,<5"]
keybert = [
  "keybert>=0.9,<1",
  "sentence-transformers>=3.4,<6",
  "scikit-learn>=1.3,<2",
]
nltk = ["nltk>=3.9.2,<4"]
spacy = ["spacy>=3.8.11,<4"]
openai = ["openai>=3,<4"]
huggingface = [
  "torch>=2.4,<3",
  "transformers>=4.48,<6",
  "sentencepiece>=0.2,<1",
  "safetensors>=0.4,<1",
]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
keywordmoves = "keywordmoves.cli:main"

[project.entry-points."keywordmoves.plugins"]
tiktok = "keywordmoves.online.tiktok:TikTokPlugin"
instagram = "keywordmoves.online.instagram:InstagramPlugin"
ahrefs = "keywordmoves.online.commercial:AhrefsPlugin"
alsoasked = "keywordmoves.online.discovery:AlsoAskedPlugin"
answerthepublic = "keywordmoves.online.websites:AnswerThePublicPlugin"
bing-autocomplete = "keywordmoves.online.websites:BingAutocompletePlugin"
brave-suggest = "keywordmoves.online.discovery:BraveSuggestPlugin"
dataforseo = "keywordmoves.online.commercial:DataForSEOPlugin"
datamuse = "keywordmoves.online.discovery:DatamusePlugin"
duckduckgo-autocomplete = "keywordmoves.online.websites:DuckDuckGoAutocompletePlugin"
google-ads = "keywordmoves.online.google:GoogleAdsPlugin"
google-autocomplete = "keywordmoves.online.websites:GoogleAutocompletePlugin"
keywords-everywhere = "keywordmoves.online.commercial:KeywordsEverywherePlugin"
keywordtool = "keywordmoves.online.commercial:KeywordToolPlugin"
search-console = "keywordmoves.online.google:SearchConsolePlugin"
semrush = "keywordmoves.online.commercial:SemrushPlugin"
serpapi = "keywordmoves.online.discovery:SerpAPIPlugin"
ubersuggest = "keywordmoves.online.websites:UbersuggestPlugin"
website-keywords = "keywordmoves.online.websites:WebsiteKeywordsPlugin"
wikipedia = "keywordmoves.online.discovery:WikipediaPlugin"
keybert = "keywordmoves.builtin.keybert_keywords:KeyBERTKeywordPlugin"
nltk = "keywordmoves.builtin.nltk_keywords:NLTKKeywordPlugin"
google-trends = "keywordmoves.builtin.google_trends:GoogleTrendsPlugin"
observed-evidence = "keywordmoves.builtin.observed_evidence:ObservedEvidencePlugin"
spacy = "keywordmoves.builtin.spacy_keywords:SpacyKeywordPlugin"
text-library = "keywordmoves.builtin.text_library:TextLibraryPlugin"

[project.entry-points."keywordmoves.llms"]
openai = "keywordmoves.builtin.openai_llm:OpenAILLM"
huggingface-transformers = "keywordmoves.builtin.huggingface_llm:HuggingFaceTransformersLLM"

[project.urls]
Homepage = "https://github.com/kieransimkin/keywordmoves"
Repository = "https://github.com/kieransimkin/keywordmoves"
Issues = "https://github.com/kieransimkin/keywordmoves/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
